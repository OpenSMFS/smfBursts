[build-system]
requires = [
    "setuptools>=77", 
    "setuptools_scm>=8.0",
    "numpy>=1.20"
]
build-backend = "setuptools.build_meta"

[project]
name = "smfbursts"
dynamic = ["version", ]
authors = [
    {name="Paul David Harris", email="harripd@gmail.com"}]
description = "Burst analysis toolkit for single and multi-spot smFRET data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt", ]
keywords = ["single-molecule FRET","smFRET", "burst-analysis", "biophysics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering"
 ]

requires-python = ">= 3.10"
dependencies = [
    "numpy>=1.20",
    "pandas>=2.0",
    "scipy>=1.2", 
    "tables>=3.5",
    "msgpack>=1.0",
    "phconvert>=0.8",
    "pyFCS>=0.1.3"
]

[project.urls]
Homepage = "http://opensmfs.github.io/smfBursts/"
Documentation = "https://smfbursts.readthedocs.io/en/latest/"
Issues = "https://github.com/OpenSMFS/smfBursts/"
Repository = "https://github.com/OpenSMFS/smfBursts/issues"

[project.optional-dependencies]
scientific = ["jupyter", "matplotlib>=3.0.1"]

[tool.setuptools.packages.find]
include = ['smfbursts*']

[tool.setuptools_scm]


[tool.setuptools.package-data]
smfbursts = ["smfbursts/cfuncs",]
"smfbursts.citations" = ["citations.*", ]
